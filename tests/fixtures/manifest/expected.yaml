apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
spec:
  selector:
    app: demo
---
# This comment and all unrelated fields must survive byte-for-byte.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  labels:
    owner: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: sidecar
          image: example/sidecar:1
        - name: api
          image: example/api:1 # preserve inline comment
          resources:
            requests:
              cpu: "290m"
              memory: '896Mi'
            limits:
              cpu: 580m
              memory: "1344Mi"
