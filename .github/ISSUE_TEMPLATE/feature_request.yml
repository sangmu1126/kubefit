name: Feature request
description: Propose a focused, evidence-backed improvement
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible, safer, or easier to verify?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and representative use case
      description: Explain the workload, failure mode, or reproducible example that motivates this request.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Safety and claim boundaries
      description: Note cluster mutation, credentials, persisted artifacts, compatibility, and claims this feature must not overstate.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the current MVP exclusions and existing issues.
          required: true
